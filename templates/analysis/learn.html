{% extends 'base.html' %}
{% load static %}

{% block title %}Learn - Chess Analysis{% endblock %}

{% block content %}

<div style="display: flex; flex-direction: column; align-items: center; padding: 40px 20px;">
    <h1 style="font-size: 36px; font-weight: 700; color: var(--text-primary); margin: 0 0 16px 0; text-align: center;">
        Learn
    </h1>
    <p style="font-size: 18px; color: var(--text-secondary); margin: 0 0 48px 0; max-width: 600px; text-align: center;">
        Explore chess concepts and how computers analyze the game
    </p>

    <!-- Learn topics grid -->
    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px; max-width: 500px;">

        <!-- Openings -->
        <a href="{% url 'analysis:learn_openings' %}" style="text-decoration: none; color: inherit;">
            <div style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 12px; transition: transform 0.2s ease;"
                 onmouseover="this.style.transform='scale(1.05)'"
                 onmouseout="this.style.transform='scale(1)'">
                <div
                    data-learn-topic-board
                    data-position="r1bqkbnr/pppp1ppp/2n5/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R b KQkq -"
                    data-size="200"
                    style="width: 200px; height: 200px; border: 3px solid var(--border-color); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 12px var(--shadow-medium); background-color: var(--background-secondary);">
                </div>
                <h3 style="font-size: 18px; font-weight: 600; color: var(--text-primary); margin: 0; text-align: center;">
                    Openings
                </h3>
            </div>
        </a>

        <!-- How do evaluations work? -->
        <a href="{% url 'analysis:learn_evaluations' %}" style="text-decoration: none; color: inherit;">
            <div style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 12px; transition: transform 0.2s ease;"
                 onmouseover="this.style.transform='scale(1.05)'"
                 onmouseout="this.style.transform='scale(1)'">
                <div style="width: 200px; height: 200px; border: 3px solid var(--border-color); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 12px var(--shadow-medium); background-color: var(--background-secondary); display: flex; align-items: center; justify-content: center;">
                    <img src="{% static 'images/evaluation_bar.png' %}" alt="Evaluation bar" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <h3 style="font-size: 18px; font-weight: 600; color: var(--text-primary); margin: 0; text-align: center;">
                    How do evaluations work?
                </h3>
            </div>
        </a>

        <!-- How is cheating detected? -->
        <a href="{% url 'analysis:learn_cheating' %}" style="text-decoration: none; color: inherit;">
            <div style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 12px; transition: transform 0.2s ease;"
                 onmouseover="this.style.transform='scale(1.05)'"
                 onmouseout="this.style.transform='scale(1)'">
                <div style="width: 200px; height: 200px; border: 3px solid var(--border-color); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 12px var(--shadow-medium); background-color: var(--background-secondary); display: flex; align-items: center; justify-content: center;">
                    <img src="{% static 'images/cheating_button_image.png' %}" alt="Cheating detection" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <h3 style="font-size: 18px; font-weight: 600; color: var(--text-primary); margin: 0; text-align: center;">
                    How is cheating detected?
                </h3>
            </div>
        </a>

        <!-- How does chess data work? -->
        <a href="{% url 'analysis:learn_chess_data' %}" style="text-decoration: none; color: inherit;">
            <div style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 12px; transition: transform 0.2s ease;"
                 onmouseover="this.style.transform='scale(1.05)'"
                 onmouseout="this.style.transform='scale(1)'">
                <div style="width: 200px; height: 200px; border: 3px solid var(--border-color); border-radius: 8px; overflow: hidden; box-shadow: 0 4px 12px var(--shadow-medium); background-color: var(--background-secondary); display: flex; align-items: center; justify-content: center;">
                    <img src="{% static 'images/chess_statistics_button.png' %}" alt="Chess statistics" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <h3 style="font-size: 18px; font-weight: 600; color: var(--text-primary); margin: 0; text-align: center;">
                    How does chess data work?
                </h3>
            </div>
        </a>

    </div>
</div>

{% endblock %}
